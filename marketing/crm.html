header{background:var(--e900);color:#fff;padding:14px 16px 0;position:sticky;top:0;z-index:50}
.hrow{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.brand{font-family:'Norwester','Arial Narrow',Arial,sans-serif;font-size:22px;letter-spacing:1px}

nav{display:flex;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch}

main{max-width:860px;margin:0 auto;padding:16px}
h2{font-size:19px;font-weight:900;margin:6px 0 12px}

.muted{color:var(--tmuted);font-size:12.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.pill{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;

.pill.warn{background:#fff7e6;color:var(--amber);border-color:#f0dcb0}
.pill.due{background:#fdeeec;color:var(--red);border-color:#f2c9c4}
.pill.win{background:var(--e400);color:#fff;border-color:var(--e400)}
button.b{background:var(--e400);color:#fff;border:none;border-radius:6px;padding:9px 14px;font-size:13px;
font-weight:800;cursor:pointer;letter-spacing:0.03em}
button.b:active{background:var(--e300)}
button.b.ghost{background:#fff;color:var(--e400);border:1.5px solid var(--e100)}
button.b.sm{padding:6px 10px;font-size:12px}
button.b.warnb{background:var(--amber)}
input,select,textarea{width:100%;background:var(--off);border:1.5px solid var(--bl);border-radius:6px;
color:var(--td);padding:10px 12px;font-size:14px;font-family:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--e400)}
label{display:block;font-size:10.5px;letter-spacing:0.12em;text-transform:uppercase;color:var(--tmuted);
font-weight:800;margin:10px 0 4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:560px){.g3{grid-template-columns:1fr 1fr}}
.stat{background:var(--e900);color:#fff;border-radius:8px;padding:14px;text-align:center}
.stat b{display:block;font-size:24px;font-weight:900;color:var(--e200)}
.stat span{font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.55);font-weight:700}
.tpl{background:var(--e50);border:1.5px solid var(--e100);border-radius:8px;padding:12px;margin:8px 0;
white-space:pre-wrap;font-size:13.5px;max-height:230px;overflow:auto}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--e900);color:#fff;
padding:10px 20px;border-radius:8px;font-size:13.5px;font-weight:700;display:none;z-index:99;box-shadow:0 4px 18px rgba(0,0,0,0.25)}
.fab{position:fixed;bottom:16px;right:16px;left:16px;max-width:860px;margin:0 auto;display:flex;gap:8px;z-index:60}
.fab button{flex:1;padding:14px;font-size:14px;border-radius:10px;box-shadow:0 4px 14px rgba(7,24,16,0.3)}
details{margin:6px 0}
summary{cursor:pointer;font-weight:800;font-size:14px;padding:6px 0}
.steps b{display:block;margin-top:10px}
a{color:var(--e400);font-weight:700}
.srch{display:inline-block;background:#fff;border:1.5px solid var(--e100);border-radius:6px;padding:8px 12px;

["Voicemail greeting (record this)","You've reached [Your name] at Clean Plate Hauling Co. — veteran-owned junk removal serving Wixom and Metro Detroit. I'm probably out on a job, so here's the fastest way to get your price: text photos of what needs to go to this number, 734-743-1877, and I'll reply with a firm flat-rate quote. Or leave a message and I'll call you right back. Thanks!"]

/* prospect cadence: status -> {next status hint, days until due, which template} */
const CAD={
 'New':       {do:'Send intro email', days:0,  tpl:'intro'},
 'Emailed':   {do:'Call them (Day 3)', days:3,  tpl:'call'},
 'Called':    {do:'Send value bump + photo (Day 7)', days:4, tpl:'bump7'},
 'Value Sent':{do:'Final note (Day 21)', days:14, tpl:'bump21'},
 'Final Sent':{do:'Quarterly check-in', days:60, tpl:'quarterly'},
 'Active ✦':  {do:'Monthly check-in', days:30, tpl:'quarterly'},
 'Dead':      {do:'', days:0, tpl:''}
};
const PSTATUSES=Object.keys(CAD);
const LSTAGES=['New Lead','Contacted','Quoted','Scheduled','Completed','Review Asked'];

/* ============ STATE ============ */
let S=load();
function load(){
  try{const d=JSON.parse(localStorage.getItem(LS));if(d&&d.prospects)return d;}catch(e){}
  return {prospects:SEED.map((r,i)=>({id:'p'+i,cat:r[0],name:r[1],city:r[2],web:r[3],phone:r[4],notes:r[5],ek:r[6],email:'',status:'New',last:'',due:today(),log:[]})),
   leads:[],activity:[]};
}
function save(){localStorage.setItem(LS,JSON.stringify(S));}
function act(t){S.activity.unshift({d:today(),t});S.activity=S.activity.slice(0,60);save();}

/* ============ HELPERS ============ */
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._x);t._x=setTimeout(()=>t.style.display='none',2200);}
function copy(txt,msg){navigator.clipboard.writeText(txt).then(()=>toast(msg||'Copied — paste and send!')).catch(()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast(msg||'Copied!');});}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function msgFor(p,kind){
  kind=kind||CAD[p.status].tpl;
  if(kind==='intro'){const c=p.ek&&CUSTOM[p.ek]?CUSTOM[p.ek]:null;
    if(c)return {s:c.s,b:c.b};
    const t=TPL[p.cat]||TPL.PM;return {s:t.s.replace(/{co}/g,p.name).replace(/{city}/g,p.city),b:t.b.replace(/{co}/g,p.name).replace(/{city}/g,p.city)};}
  const t=BUMPS[kind]||BUMPS.bump3;return {s:t.s,b:t.b};
}
function advance(p){
  const order=['New','Emailed','Called','Value Sent','Final Sent'];
  const i=order.indexOf(p.status);
  const next=i>=0&&i<order.length-1?order[i+1]:p.status;
  p.status=next;p.last=today();p.due=addDays(today(),CAD[next].days||0);
  p.log.unshift(today()+' → '+next);act(p.name+' → '+next);save();render();
}
function setPStatus(p,st){p.status=st;p.last=today();p.due=st==='Dead'?'':addDays(today(),CAD[st].days||0);p.log.unshift(today()+' → '+st);act(p.name+' → '+st);save();render();}

/* ============ VIEWS ============ */
const TABS=['Today','Pipeline','Prospects','Scripts','Find','Stats','Playbook'];
let tab='Today';
function dueProspects(){return S.prospects.filter(p=>p.status!=='Dead'&&p.status!=='Active ✦'&&p.due&&p.due<=today());}
function needReply(){return S.leads.filter(l=>l.stage==='New Lead');}
function quoteChase(){return S.leads.filter(l=>l.stage==='Quoted'&&l.updated<today());}

function render(){
  const nav=document.getElementById('nav');
  nav.innerHTML=TABS.map(t=>{
    let b='';
    if(t==='Today'){const n=dueProspects().length+needReply().length+quoteChase().length;if(n)b='<span class="bdg">'+n+'</span>';}
    return '<button class="'+(tab===t?'on':'')+'" onclick="go(\''+t+'\')">'+t+b+'</button>';
  }).join('');
  document.getElementById('view').innerHTML=({Today:vToday,Pipeline:vPipe,Prospects:vPros,Scripts:vScripts,Find:vFind,Stats:vStats,Playbook:vPlay})[tab]();
  document.getElementById('fab').innerHTML=tab==='Pipeline'?'<button class="b" onclick="addLeadUI()">+ New Lead</button>':
    tab==='Prospects'?'<button class="b" onclick="addProspectUI()">+ New Prospect</button>':'';
}
function go(t){tab=t;render();window.scrollTo(0,0);}

function vToday(){
  const due=dueProspects(),nr=needReply(),qc=quoteChase();
  let h='<h2>Today — '+new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})+'</h2>';
  h+='<div class="card" style="background:var(--e900);color:#fff;border:none"><b style="color:var(--e200)">The 5-minute rule:</b> reply to every new lead within 5 minutes. Speed is the #1 reason a junk job books with you instead of the other guy.</div>';
  if(nr.length){h+='<h3>🔥 Leads waiting on you ('+nr.length+')</h3>';nr.forEach(l=>{h+='<div class="card"><div class="row"><b class="grow">'+esc(l.name)+' · '+esc(l.city)+'</b><span class="pill due">REPLY NOW</span></div><div class="muted">'+esc(l.items||'')+' · '+esc(l.source)+' · '+esc(l.phone)+'</div><div class="row" style="margin-top:8px"><button class="b sm" onclick="copyScript(2)">📋 Photo-quote reply</button><a class="b sm ghost" href="sms:'+esc(l.phone)+'" style="text-decoration:none">💬 Text</a><button class="b sm ghost" onclick="bump(\''+l.id+'\')">Mark contacted</button></div></div>';});}
  if(qc.length){h+='<h3>💰 Quotes to chase ('+qc.length+')</h3>';qc.forEach(l=>{h+='<div class="card"><div class="row"><b class="grow">'+esc(l.name)+' — $'+esc(l.quote||'?')+'</b><span class="pill warn">Follow up</span></div><div class="row" style="margin-top:8px"><button class="b sm" onclick="copyScript(3)">📋 Copy follow-up</button><a class="b sm ghost" href="sms:'+esc(l.phone)+'" style="text-decoration:none">💬 Text</a></div></div>';});}
  h+='<h3>📨 Outreach due ('+due.length+')</h3>';
  if(!due.length)h+='<div class="card muted">Nothing due — go to <a onclick="go(\'Find\')" style="cursor:pointer">Find</a> and add 5 new prospects, or post a before/after on Facebook.</div>';
  due.slice(0,12).forEach(p=>{const m=msgFor(p);
    h+='<div class="card cat-'+p.cat+'"><div class="row"><b class="grow">'+esc(p.name)+'</b><span class="pill">'+esc(p.cat)+'</span><span class="pill due">'+esc(CAD[p.status].do)+'</span></div>'+
    '<div class="muted">'+esc(p.notes)+(p.web?' · <a href="https://'+esc(p.web)+'" target="_blank">'+esc(p.web)+'</a>':'')+'</div>'+
    '<div class="row" style="margin-top:8px"><button class="b sm" onclick="gm(\''+p.id+'\')">✉️ '+(p.status==='New'?'Send intro in Gmail':'Send in Gmail')+'</button><button class="b sm ghost" onclick="copyMsg(\''+p.id+'\')">📋 Copy</button><button class="b sm ghost" onclick="advanceP(\''+p.id+'\')">✓ Done — advance</button></div></div>';});
  if(S.activity.length){h+='<h3>Recent activity</h3><div class="card">'+S.activity.slice(0,8).map(a=>'<div class="muted">'+fmt(a.d)+' — '+esc(a.t)+'</div>').join('')+'</div>';}
  return h;
}

  let h='<h2>Customer Pipeline</h2><p class="muted" style="margin-bottom:10px">Every call, text, and form fill goes here. Tap a stage button to move them forward.</p>';
  LSTAGES.forEach(st=>{
    const ls=S.leads.filter(l=>l.stage===st);
    h+='<h3>'+st+' <span class="muted">('+ls.length+')</span></h3>';
    if(!ls.length)h+='<div class="muted" style="margin-bottom:8px">—</div>';
    ls.forEach(l=>{
      const i=LSTAGES.indexOf(st);
      h+='<div class="card"><div class="row"><b class="grow">'+esc(l.name)+'</b>'+(l.quote?'<span class="pill win">$'+esc(l.quote)+'</span>':'')+'</div>'+
      '<div class="muted">'+esc(l.city)+' · '+esc(l.source)+' · '+esc(l.phone)+(l.items?' · '+esc(l.items):'')+'</div>'+
      '<div class="row" style="margin-top:8px">'+
      (i<LSTAGES.length-1?'<button class="b sm" onclick="moveLead(\''+l.id+'\',1)">→ '+LSTAGES[i+1]+'</button>':'')+
      (st==='Completed'?'<button class="b sm warnb" onclick="copyScript(0);moveLead(\''+l.id+'\',1)">📋 Send review ask</button>':'')+
      '<a class="b sm ghost" href="tel:'+esc(l.phone)+'" style="text-decoration:none">📞</a><a class="b sm ghost" href="sms:'+esc(l.phone)+'" style="text-decoration:none">💬</a>'+
      '<button class="b sm ghost" onclick="editQuote(\''+l.id+'\')">$</button>'+
      '<button class="b sm ghost" onclick="delLead(\''+l.id+'\')" style="color:var(--red)">✕</button></div></div>';});
  });

}

function vStats(){
  const L=S.leads,P=S.prospects;
  const done=L.filter(l=>['Completed','Review Asked'].includes(l.stage));
  const rev=done.reduce((a,l)=>a+(parseFloat(l.quote)||0),0);
  const quoted=L.filter(l=>['Quoted','Scheduled','Completed','Review Asked'].includes(l.stage)).length;
  const conv=quoted?Math.round(done.length/quoted*100):0;
  const wk=addDays(today(),-7);
  const newWk=L.filter(l=>l.created>=wk).length;
  const touchWk=S.activity.filter(a=>a.d>=wk).length;
  const bySrc={};L.forEach(l=>{bySrc[l.source||'?']=(bySrc[l.source||'?']||0)+1;});
  let h='<h2>Numbers</h2><div class="g3">'+
  '<div class="stat"><b>'+L.length+'</b><span>Total leads</span></div>'+
  '<div class="stat"><b>'+done.length+'</b><span>Jobs done</span></div>'+
  '<div class="stat"><b>$'+rev.toLocaleString()+'</b><span>Revenue</span></div>'+
  '<div class="stat"><b>'+conv+'%</b><span>Quote → booked</span></div>'+
  '<div class="stat"><b>'+newWk+'</b><span>Leads this week</span></div>'+
  '<div class="stat"><b>'+touchWk+'</b><span>Touches this week</span></div></div>';
  h+='<h3>Leads by source</h3><div class="card">'+(Object.keys(bySrc).length?Object.entries(bySrc).map(e=>'<div class="row"><span class="grow">'+esc(e[0])+'</span><b>'+e[1]+'</b></div>').join(''):'<span class="muted">Log leads with their source and this tells you what\'s working.</span>')+'</div>';
  h+='<h3>B2B funnel</h3><div class="card">'+PSTATUSES.filter(s=>s!=='Dead').map(st=>'<div class="row"><span class="grow">'+st+'</span><b>'+P.filter(p=>p.status===st).length+'</b></div>').join('')+'</div>';
  h+='<h3>Backup</h3><div class="card"><p class="muted" style="margin-bottom:8px">Your data lives only on this device. Export weekly.</p><div class="row"><button class="b" onclick="exportJSON()">⬇ Backup (JSON)</button><button class="b ghost" onclick="exportCSV()">⬇ Leads CSV</button><label class="b ghost" style="display:inline-block;width:auto;cursor:pointer;margin:0">⬆ Restore<input type="file" accept=".json" style="display:none" onchange="importJSON(this)"></label></div></div>';
  return h;
}

/* ============ ACTIONS ============ */
function copyMsg(id){const p=S.prospects.find(x=>x.id===id);const m=msgFor(p);copy((m.s?'Subject: '+m.s+'\n\n':'')+m.b,'Copied — paste into email/text. Then hit ✓ Advance.');}
function gm(id){
  const p=S.prospects.find(x=>x.id===id);
  const kind=CAD[p.status].tpl||'intro';
  const intro=msgFor(p,'intro');
  const m=kind==='intro'?intro:msgFor(p,kind);
  const subj=kind==='intro'?m.s:('Re: '+intro.s);
  if(!p.email){
    const e=prompt("Their email address (grab it from their website's contact page). Leave blank to type it in Gmail:");
    if(e===null)return;
    if(e.trim()){p.email=e.trim();save();}
  }
  window.open('https://mail.google.com/mail/?view=cm&fs=1&to='+encodeURIComponent(p.email||'')+'&su='+encodeURIComponent(subj)+'&body='+encodeURIComponent(m.b),'_blank');
  toast('Review it in Gmail and hit Send — then tap ✓ Advance here');
}
function advanceP(id){advance(S.prospects.find(x=>x.id===id));}
function statP(id,st){if(PSTATUSES.includes(st))setPStatus(S.prospects.find(x=>x.id===id),st);}
function copyScript(i){copy(SCRIPTS[i][1]);}
function bump(id){const l=S.leads.find(x=>x.id===id);l.stage='Contacted';l.updated=today();act('Replied to lead: '+l.name);save();render();}
function moveLead(id,dir){const l=S.leads.find(x=>x.id===id);const i=LSTAGES.indexOf(l.stage)+dir;if(i>=0&&i<LSTAGES.length){l.stage=LSTAGES[i];l.updated=today();act(l.name+' → '+l.stage);save();render();}}
function delLead(id){if(confirm('Delete this lead?')){S.leads=S.leads.filter(x=>x.id!==id);save();render();}}
function editQuote(id){const l=S.leads.find(x=>x.id===id);const q=prompt('Quote amount ($):',l.quote||'');if(q!==null){l.quote=q;save();render();}}
function addLeadUI(){
  const name=prompt('Customer name:');if(!name)return;
  const phone=prompt('Phone:')||'';
  const city=prompt('City:')||'';
  const source=prompt('Source (Google / Facebook / Thumbtack / Referral / Sign / Other):')||'Other';
  const items=prompt('What needs to go?')||'';
  S.leads.unshift({id:'l'+Date.now(),name,phone,city,source,items,quote:'',stage:'New Lead',created:today(),updated:today()});
  act('New lead: '+name+' ('+source+')');save();render();toast('Lead added — reply within 5 minutes!');
}
function addProspectUI(){
  const name=prompt('Company name:');if(!name)return;
  const cat=prompt('Category (PM / Estate / Realtor / Senior / Mover / Contractor / Dumpster / Storage):','PM')||'PM';
  const city=prompt('City:')||'';
  const web=prompt('Website (optional):')||'';
  const notes=prompt('Why they need a hauler (one line):')||'';
  S.prospects.unshift({id:'p'+Date.now(),cat,name,city,web,phone:'',notes,ek:'',email:'',status:'New',last:'',due:today(),log:[]});
  act('New prospect: '+name);save();render();toast('Added — intro email is ready on the Today tab');
}
function exportJSON(){const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cleanplate-crm-backup-'+today()+'.json';a.click();}
function exportCSV(){const rows=[['Name','Phone','City','Source','Items','Quote','Stage','Created']].concat(S.leads.map(l=>[l.name,l.phone,l.city,l.source,l.items,l.quote,l.stage,l.created]));const csv=rows.map(r=>r.map(c=>'"'+String(c||'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='cleanplate-leads-'+today()+'.csv';a.click();}
function importJSON(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.prospects&&d.leads){S=d;save();render();toast('Restored!');}else toast('Not a valid backup file');}catch(e){toast('Could not read that file');}};r.readAsText(f);}

render();
</script>
</body>
