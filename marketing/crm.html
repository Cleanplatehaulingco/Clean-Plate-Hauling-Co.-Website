nav{display:flex;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch}

main{max-width:860px;margin:0 auto;padding:16px}
h2{font-size:19px;font-weight:900;margin:6px 0 12px}
h3{font-size:15px;font-weight:800;margin:14px 0 8px}

.muted{color:var(--tmuted);font-size:12.5px}

.grow{flex:1}
.pill{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;

button.b:active{background:var(--e300)}
button.b.ghost{background:#fff;color:var(--e400);border:1.5px solid var(--e100)}
button.b.sm{padding:6px 10px;font-size:12px}
button.b.warnb{background:var(--amber)}
input,select,textarea{width:100%;background:var(--off);border:1.5px solid var(--bl);border-radius:6px;
color:var(--td);padding:10px 12px;font-size:14px;font-family:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--e400)}
label{display:block;font-size:10.5px;letter-spacing:0.12em;text-transform:uppercase;color:var(--tmuted);
font-weight:800;margin:10px 0 4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

.stat{background:var(--e900);color:#fff;border-radius:8px;padding:14px;text-align:center}
.stat b{display:block;font-size:24px;font-weight:900;color:var(--e200)}
.stat span{font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.55);font-weight:700}
.tpl{background:var(--e50);border:1.5px solid var(--e100);border-radius:8px;padding:12px;margin:8px 0;

.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--e900);color:#fff;

.fab{position:fixed;bottom:16px;right:16px;left:16px;max-width:860px;margin:0 auto;display:flex;gap:8px;z-index:60}
.fab button{flex:1;padding:14px;font-size:14px;border-radius:10px;box-shadow:0 4px 14px rgba(7,24,16,0.3)}
details{margin:6px 0}
summary{cursor:pointer;font-weight:800;font-size:14px;padding:6px 0}
.steps b{display:block;margin-top:10px}
a{color:var(--e400);font-weight:700}
.srch{display:inline-block;background:#fff;border:1.5px solid var(--e100);border-radius:6px;padding:8px 12px;

/* ============ HELPERS ============ */
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._x);t._x=setTimeout(()=>t.style.display='none',2200);}
function copy(txt,msg){navigator.clipboard.writeText(txt).then(()=>toast(msg||'Copied — paste and send!')).catch(()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast(msg||'Copied!');});}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function msgFor(p,kind){
  kind=kind||CAD[p.status].tpl;
  if(kind==='intro'){const c=p.ek&&CUSTOM[p.ek]?CUSTOM[p.ek]:null;
    if(c)return {s:c.s,b:c.b};
    const t=TPL[p.cat]||TPL.PM;return {s:t.s.replace(/{co}/g,p.name).replace(/{city}/g,p.city),b:t.b.replace(/{co}/g,p.name).replace(/{city}/g,p.city)};}
  const t=BUMPS[kind]||BUMPS.bump3;return {s:t.s,b:t.b};
}
function advance(p){
  const order=['New','Emailed','Called','Value Sent','Final Sent'];
  const i=order.indexOf(p.status);
  const next=i>=0&&i<order.length-1?order[i+1]:p.status;
  p.status=next;p.last=today();p.due=addDays(today(),CAD[next].days||0);
  p.log.unshift(today()+' → '+next);act(p.name+' → '+next);save();render();
}

90:[{t:"🎓 90-DAY GRADUATION — full quarter review in Stats. You built a real business. Set the next 90-day target with me, and let's talk about what's next.",m:25,go:"Stats"}]
};

function rhythmTasks(n){
  const dow=new Date(ldate(n)+'T12:00').getDay();
  const tasks=[];
  if(dow>=1&&dow<=5)tasks.push({t:"Today tab → reply to any lead, then send today's due B2B touches (intros + follow-ups). Aim for 5–10.",m:25,go:"Today"});
  if(dow===1)tasks.push({t:"Monday reset: skim this week's goal above, and add 5 fresh prospects so you never run dry (Find tab).",m:10,go:"Find"});
  if(dow===2)tasks.push({t:"Post one update — a service spotlight or a tip (Scripts tab has copy).",m:10,go:"Scripts"});
  if(dow===3)tasks.push({t:"Add 5 new B2B prospects from a city you haven't mined (Find tab).",m:10,go:"Find"});
  if(dow===4)tasks.push({t:"Post a before/after from a recent job, or a truck/donation photo. Real work is your best content.",m:10});
  if(dow===5){tasks.push({t:"Walk flyers into 2–3 realtor offices or storage facilities near a job today (print flyer.html).",m:30,href:"flyer.html"});
              tasks.push({t:"Friday numbers: open Stats, log the week, and double down on what's working.",m:10,go:"Stats"});}
  if(dow===6){tasks.push({t:"Neighbor blitz: a card on the 10 nearest doors after each job today (neighbor-flyer.html).",m:15,href:"neighbor-flyer.html"});
              tasks.push({t:"Answer any \"ISO junk removal\" posts in groups/Nextdoor — speed wins (Scripts tab).",m:10,go:"Scripts"});}
  if(dow===0)tasks.push({t:"Plan next week + catch up on any review texts you owe. Then rest — time with Samantha and Lovelyn.",m:15});
  return tasks;
}

function launchPlan(n){
  const wk=lweek(n);
  let tasks=LDAYS[n]?LDAYS[n].slice():rhythmTasks(n);
  if(LSPECIAL[n])tasks=LSPECIAL[n].concat(tasks);
  return {n,wk,wkInfo:LWEEKS[wk]||LWEEKS[13],tasks};
}
function launchRemaining(){const n=ldayNum();if(n<1||n>90)return 0;const dn=launchPlan(n);const done=(S.launch.done['d'+n]||[]);return Math.max(0,dn.tasks.length-done.filter(i=>i<dn.tasks.length).length);}
function toggleL(n,i){const k='d'+n,arr=S.launch.done[k]||[],p=arr.indexOf(i);if(p>=0)arr.splice(p,1);else arr.push(i);S.launch.done[k]=arr;save();render();}
function setLStart(){const v=prompt("Your Launch Day — the day your Google profile went live (YYYY-MM-DD):",lstart());if(v&&/^\d{4}-\d{2}-\d{2}$/.test(v.trim())){S.launch.start=v.trim();launchView=null;save();render();toast("Launch day set!");}else if(v)toast("Use the format YYYY-MM-DD");}
function lJump(){launchView=Math.min(Math.max(ldayNum(),1),90);render();window.scrollTo(0,0);}
function lNav(d){launchView=Math.min(90,Math.max(1,(launchView||ldayNum())+d));render();window.scrollTo(0,0);}

function vLaunch(){
  const cur=ldayNum();
  if(launchView===null)launchView=Math.min(Math.max(cur,1),90);
  const n=launchView,plan=launchPlan(n),done=(S.launch.done['d'+n]||[]),isToday=(n===cur);
  let h='<h2>90-Day Launch Plan</h2>';
  if(cur<1)h+='<div class="card"><span class="pill warn">Heads up</span> Your launch day is set for '+fmt(lstart())+'. The countdown starts then — <a onclick="setLStart()" style="cursor:pointer">change it</a> if that\'s wrong.</div>';
  if(cur>90)h+='<div class="card" style="background:var(--e400);color:#fff;border:none"><b>🎓 You finished the 90-day plan.</b> Look back through any day below, or ask me to build your next-quarter plan.</div>';
  h+='<div class="card" style="background:var(--e900);color:#fff;border:none">'+
     '<div class="row"><b class="grow" style="font-size:18px;color:var(--e200)">Day '+n+' of 90</b>'+
     '<span class="muted" style="color:rgba(255,255,255,0.7)">'+DOW[new Date(ldate(n)+'T12:00').getDay()]+' · '+fmt(ldate(n))+(isToday?' · TODAY':'')+'</span></div>'+
     '<div style="margin-top:6px;font-weight:800">Week '+plan.wk+' of 13 · '+plan.wkInfo.t+'</div>'+
     '<div class="muted" style="color:rgba(255,255,255,0.8);margin-top:4px">'+esc(plan.wkInfo.g)+'</div></div>';
  h+='<div class="card" style="border-left:5px solid var(--e300)"><b>Every day, no matter what:</b> <span class="muted">① answer every lead in 5 minutes · ② send the review text before you leave every job · ③ log every lead. The tasks below are the <i>build</i> work on top of those three.</span></div>';
  const total=plan.tasks.reduce((a,t)=>a+t.m,0),doneCount=done.filter(i=>i<plan.tasks.length).length;
  h+='<div class="row" style="margin:6px 2px 10px"><b class="grow">Today\'s tasks — '+doneCount+'/'+plan.tasks.length+' done</b><span class="pill">⏱ ~'+total+' min total</span></div>';
  plan.tasks.forEach((t,i)=>{const d=done.indexOf(i)>=0;
    h+='<div class="card" style="'+(d?'opacity:.55;':'')+'border-left:4px solid '+(d?'var(--e200)':'var(--bl)')+'">'+
       '<div class="row" style="align-items:flex-start;gap:10px">'+
       '<input type="checkbox" '+(d?'checked ':'')+'onchange="toggleL('+n+','+i+')" style="width:22px;height:22px;margin-top:1px;padding:0;flex:none">'+
       '<div class="grow"><div style="'+(d?'text-decoration:line-through;':'')+'font-weight:600">'+esc(t.t)+'</div>'+
       '<div class="row" style="margin-top:6px"><span class="pill warn">⏱ '+t.m+' min</span>'+
       (t.go?'<button class="b sm" onclick="go(\''+t.go+'\')">Open '+t.go+' →</button>':'')+
       (t.href?'<a class="b sm ghost" href="'+t.href+'" target="_blank" style="text-decoration:none">Open file →</a>':'')+
       '</div></div></div></div>';});
  h+='<div class="row" style="margin:14px 0 4px">'+
     '<button class="b ghost grow" '+(n<=1?'disabled style="opacity:.4"':'')+' onclick="lNav(-1)">← Prev day</button>'+
     (!isToday&&cur>=1&&cur<=90?'<button class="b" onclick="lJump()">Jump to today (Day '+cur+')</button>':'')+
     '<button class="b ghost grow" '+(n>=90?'disabled style="opacity:.4"':'')+' onclick="lNav(1)">Next day →</button></div>';
  h+='<div class="card muted" style="font-size:11.5px">Add this page to your phone\'s home screen. Open it each morning, knock out the tasks, check them off. <a onclick="setLStart()" style="cursor:pointer">Set/adjust launch day</a> (currently '+fmt(lstart())+').</div>';
  return h;
}

/* ============ ACTIONS ============ */
function copyMsg(id){const p=S.prospects.find(x=>x.id===id);const m=msgFor(p);copy((m.s?'Subject: '+m.s+'\n\n':'')+m.b,'Copied — paste into email/text. Then hit ✓ Advance.');}
function gm(id){
  const p=S.prospects.find(x=>x.id===id);
  const kind=CAD[p.status].tpl||'intro';
  const intro=msgFor(p,'intro');
  const m=kind==='intro'?intro:msgFor(p,kind);
  const subj=kind==='intro'?m.s:('Re: '+intro.s);
  if(!p.email){
    const e=prompt("Their email address (grab it from their website's contact page). Leave blank to type it in Gmail:");
    if(e===null)return;
    if(e.trim()){p.email=e.trim();save();}
  }
  window.open('https://mail.google.com/mail/?view=cm&fs=1&to='+encodeURIComponent(p.email||'')+'&su='+encodeURIComponent(subj)+'&body='+encodeURIComponent(m.b),'_blank');
  toast('Review it in Gmail and hit Send — then tap ✓ Advance here');
}
function advanceP(id){advance(S.prospects.find(x=>x.id===id));}
function statP(id,st){if(PSTATUSES.includes(st))setPStatus(S.prospects.find(x=>x.id===id),st);}
function copyScript(i){copy(SCRIPTS[i][1]);}
function setContact(id){const p=S.prospects.find(x=>x.id===id);const v=prompt('Decision maker name & title (e.g., Jane Smith — Operations Manager):',p.contact||'');if(v===null)return;p.contact=v.trim();save();render();toast(p.contact?'Saved — greet them by name in the email!':'Cleared');}
function setEmail(id){const p=S.prospects.find(x=>x.id===id);const v=prompt('Their email address:',p.email||'');if(v===null)return;p.email=v.trim();save();render();}
function domainOf(p){return (p.web||'').replace(/^https?:\/\//,'').replace(/^www\./,'').split('/')[0];}
function patterns(id){
  const p=S.prospects.find(x=>x.id===id);const d=domainOf(p);
  if(!d){toast('No website on file — tap 👤 Save contact and add their site first');return;}
  let names=(p.contact||'').replace(/[—–(].*$/,'').trim().toLowerCase().split(/\s+/).filter(w=>/^[a-z'.-]{2,}$/.test(w));
  let list=['info@'+d,'office@'+d];
  if(names.length>=2){const f=names[0],l=names[names.length-1];
    list=[f+'@'+d,f+'.'+l+'@'+d,(f[0]+l)+'@'+d,(f+l[0])+'@'+d,l+'@'+d].concat(list);}
  else if(names.length===1){list=[names[0]+'@'+d].concat(list);}
  list=[...new Set(list)];
  document.getElementById('pat-'+p.id).innerHTML='<div style="margin-top:6px">'+list.map(e=>'<span class="srch" style="cursor:pointer" onclick="copy(\''+e+'\')">'+e+' 📋</span><a class="srch" target="_blank" href="https://www.google.com/search?q='+encodeURIComponent('"'+e+'"')+'">verify</a>').join('')+'</div><div class="muted" style="margin-top:4px;font-size:11.5px">Tap an address to copy · "verify" googles it in quotes (a hit = it\'s real). With small companies, info@ usually lands on the owner\'s phone anyway.</div>';
}
function aiResearch(id){
  const p=S.prospects.find(x=>x.id===id);
  copy('You are my B2B prospect researcher (like ZoomInfo, but you cite sources). Company: '+p.name+' — '+p.cat+' in '+p.city+', Michigan'+(p.web?' — website: '+p.web:'')+'.\n\nUsing web search, find:\n1) The decision maker who would hire a junk removal / cleanout vendor (owner, operations manager, property manager, or project manager). Full name + title.\n2) The best email to reach them. Check: the company website (contact/about/team pages), LinkedIn, their Facebook page, and the Michigan LARA business entity search at cofs.lara.state.mi.us (the registered agent of the LLC is often the owner).\n3) A direct phone number if listed.\n\nRules: NEVER invent an email address. If you infer one from a pattern, label it GUESS. Answer in exactly this format:\nName | Title | Email (or GUESS: address) | Phone | Source URLs','AI researcher copied — paste into Claude or ChatGPT (web search on), then save what it finds with 👤 and ✉');
}
function bump(id){const l=S.leads.find(x=>x.id===id);l.stage='Contacted';l.updated=today();act('Replied to lead: '+l.name);save();render();}
function moveLead(id,dir){const l=S.leads.find(x=>x.id===id);const i=LSTAGES.indexOf(l.stage)+dir;if(i>=0&&i<LSTAGES.length){l.stage=LSTAGES[i];l.updated=today();act(l.name+' → '+l.stage);save();render();}}
function delLead(id){if(confirm('Delete this lead?')){S.leads=S.leads.filter(x=>x.id!==id);save();render();}}
function editQuote(id){const l=S.leads.find(x=>x.id===id);const q=prompt('Quote amount ($):',l.quote||'');if(q!==null){l.quote=q;save();render();}}
function addLeadUI(){
  const name=prompt('Customer name:');if(!name)return;
  const phone=prompt('Phone:')||'';
  const city=prompt('City:')||'';
  const source=prompt('Source (Google / Facebook / Thumbtack / Referral / Sign / Other):')||'Other';
  const items=prompt('What needs to go?')||'';
  S.leads.unshift({id:'l'+Date.now(),name,phone,city,source,items,quote:'',stage:'New Lead',created:today(),updated:today()});
  act('New lead: '+name+' ('+source+')');save();render();toast('Lead added — reply within 5 minutes!');
}
function addProspectUI(){
  const name=prompt('Company name:');if(!name)return;
  const cat=prompt('Category (PM / Estate / Realtor / Senior / Mover / Contractor / Dumpster / Storage):','PM')||'PM';
  const city=prompt('City:')||'';
  const web=prompt('Website (optional):')||'';
  const notes=prompt('Why they need a hauler (one line):')||'';
  S.prospects.unshift({id:'p'+Date.now(),cat,name,city,web,phone:'',notes,ek:'',email:'',status:'New',last:'',due:today(),log:[]});
  act('New prospect: '+name);save();render();toast('Added — intro email is ready on the Today tab');
}
function exportJSON(){const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cleanplate-crm-backup-'+today()+'.json';a.click();}
function exportCSV(){const rows=[['Name','Phone','City','Source','Items','Quote','Stage','Created']].concat(S.leads.map(l=>[l.name,l.phone,l.city,l.source,l.items,l.quote,l.stage,l.created]));const csv=rows.map(r=>r.map(c=>'"'+String(c||'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='cleanplate-leads-'+today()+'.csv';a.click();}
function importJSON(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.prospects&&d.leads){S=migrate(d);save();render();toast('Restored!');}else toast('Not a valid backup file');}catch(e){toast('Could not read that file');}};r.readAsText(f);}

/* ---- access gate: SHA-256 of the passphrase (privacy lock for an internal tool, not high-grade security) ---- */
const GATE_HASH='5d03c6cc82999234d06cd2f95a898b5725e0dd5d9ed4b288e6755440edf28683';
const GATE_KEY='cph_unlock_v1';
async function sha256hex(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}
function showApp(){const g=document.getElementById('gate');if(g)g.style.display='none';render();}
async function tryUnlock(){const i=document.getElementById('gpw'),e=document.getElementById('gerr');try{const h=await sha256hex(i.value);if(h===GATE_HASH){localStorage.setItem(GATE_KEY,'1');showApp();}else{e.textContent='Incorrect password — try again.';e.style.display='block';i.value='';i.focus();}}catch(_){e.textContent='Open this page over https to unlock.';e.style.display='block';}}
function lock(){localStorage.removeItem(GATE_KEY);location.reload();}
function boot(){if(localStorage.getItem(GATE_KEY)==='1'){showApp();return;}const g=document.getElementById('gate');if(g)g.style.display='flex';const i=document.getElementById('gpw');if(i){i.focus();i.addEventListener('keydown',ev=>{if(ev.key==='Enter')tryUnlock();});}}
boot();
</script>
