function migrate(d){d.prospects.forEach(p=>{if(p.contact===undefined)p.contact='';if(p.email===undefined)p.email='';if(!p.contact&&CONTACTS[p.name])p.contact=CONTACTS[p.name];if(!p.email&&PROSPECT_EMAILS[p.name])p.email=PROSPECT_EMAILS[p.name];});const existing=new Set(d.prospects.map(p=>p.name));SEED.forEach(r=>{if(!existing.has(r[1])){d.prospects.push({id:'p_s_'+r[1].replace(/\W/g,''),cat:r[0],name:r[1],city:r[2],web:r[3],phone:r[4],notes:r[5],ek:r[6],email:PROSPECT_EMAILS[r[1]]||'',contact:CONTACTS[r[1]]||'',status:'New',last:'',due:today(),log:[]}); }});if(!d.launch)d.launch={start:today(),done:{}};if(!d.launch.done)d.launch.done={};if(!d.launch.startSynced){d.launch.start='2026-06-17';d.launch.startSynced=true;}if(!d.pricing)d.pricing={dumpTon:75,dumpMin:30,fuel:25,hourly:60,priceAdj:1};if(d.pricing.priceAdj===undefined)d.pricing.priceAdj=1;if(!d.metrics)d.metrics={reviews:4};if(!d.metrics.reviewsSynced){d.metrics.reviews=Math.max(d.metrics.reviews||0,4);d.metrics.reviewsSynced=true;}if(!d.huntLog)d.huntLog={};return d;}
function load(){
  try{const d=JSON.parse(localStorage.getItem(LS));if(d&&d.prospects)return migrate(d);}catch(e){}
  return migrate({prospects:SEED.map((r,i)=>({id:'p'+i,cat:r[0],name:r[1],city:r[2],web:r[3],phone:r[4],notes:r[5],ek:r[6],email:'',contact:'',status:'New',last:'',due:today(),log:[]})),
   leads:[],activity:[]});
}
function save(){localStorage.setItem(LS,JSON.stringify(S));}
function act(t){S.activity.unshift({d:today(),t});S.activity=S.activity.slice(0,60);save();}

/* ============ HELPERS ============ */
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._x);t._x=setTimeout(()=>t.style.display='none',2200);}
function copy(txt,msg){navigator.clipboard.writeText(txt).then(()=>toast(msg||'Copied — paste and send!')).catch(()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast(msg||'Copied!');});}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function msgFor(p,kind){
  kind=kind||CAD[p.status].tpl;
  if(kind==='intro'){const c=p.ek&&CUSTOM[p.ek]?CUSTOM[p.ek]:null;
    if(c)return {s:c.s,b:c.b};
    const t=TPL[p.cat]||TPL.PM;return {s:t.s.replace(/{co}/g,p.name).replace(/{city}/g,p.city),b:t.b.replace(/{co}/g,p.name).replace(/{city}/g,p.city)};}
  const t=BUMPS[kind]||BUMPS.bump3;return {s:t.s,b:t.b};
}
function advance(p){
  const order=['New','Emailed','Called','Value Sent','Final Sent'];
  const i=order.indexOf(p.status);
  const next=i>=0&&i<order.length-1?order[i+1]:p.status;
  p.status=next;p.last=today();p.due=addDays(today(),CAD[next].days||0);
  p.log.unshift(today()+' → '+next);act(p.name+' → '+next);save();render();
}
function setPStatus(p,st){p.status=st;p.last=today();p.due=st==='Dead'?'':addDays(today(),CAD[st].days||0);p.log.unshift(today()+' → '+st);act(p.name+' → '+st);save();render();}

    +'<b>🏢 B2B drop:</b> walked in the door of any business — property manager, realtor, stager, storage facility, restoration company, probate attorney. Even if nobody was there and you just left a card. Each location = 1 touch.<br/><br/>'

}

 {k:'1/2',label:'½',frac:'half bed',tons:0.55,base:285,hrs:1.5},
 {k:'5/8',label:'⅝',frac:'',tons:0.7,base:345,hrs:1.75},
 {k:'3/4',label:'¾',frac:'',tons:0.85,base:400,hrs:2},
 {k:'Full',label:'Full',frac:'heaped bed',tons:1.1,base:475,hrs:2.5}
];
const PITEMS=[
 {k:'fridge',label:'Fridge / Freezer / AC',price:35,tons:0.08,note:'Freon fee'},
 {k:'appliance',label:'Washer / Dryer / Stove',price:20,tons:0.07},
 {k:'mattress',label:'Mattress / Box spring',price:25,tons:0.03},
 {k:'tv',label:'TV / Electronics',price:25,tons:0.02},
 {k:'tire',label:'Tire',price:8,tons:0.02},
 {k:'piano',label:'Upright piano',price:150,tons:0.15,flag:'2-person job'},
 {k:'hottub',label:'Hot tub',price:200,tons:0.2,flag:'disassembly + 2-person'}
];
const PACCESS=[
 {k:'stairs',label:'Stairs / basement / upstairs',pct:0.15},
 {k:'carry',label:'Long carry / no driveway',pct:0.10},
 {k:'disassembly',label:'Disassembly',pct:0.10,hrs:0.5},
 {k:'heavy',label:'Heavy/dense (concrete, dirt, tile)',weightMult:2.5}
];
let PSEL={tier:'1/4',items:{},access:[]};
function pTier(k){PSEL.tier=k;render();}
function pItem(k,d){PSEL.items[k]=Math.max(0,(PSEL.items[k]||0)+d);render();}
function pAcc(k){const i=PSEL.access.indexOf(k);if(i>=0)PSEL.access.splice(i,1);else PSEL.access.push(k);render();}
function pCfg(f,v){const n=parseFloat(v);if(!isNaN(n)&&n>=0){S.pricing[f]=n;save();render();}}
function pReset(){PSEL={tier:'1/4',items:{},access:[]};render();}
function reviewAdj(d){if(!S.metrics)S.metrics={reviews:0};S.metrics.reviews=Math.max(0,(S.metrics.reviews||0)+d);if(d>0)act('Logged a new review (total '+S.metrics.reviews+')');save();render();}
function pLogLead(){const r=priceCalc();const name=prompt('Customer name for this quote:');if(!name)return;const phone=prompt('Phone (optional):')||'';const city=prompt('City (optional):')||'';S.leads.unshift({id:'l'+Date.now(),name:name,phone:phone,city:city,source:'Quote calc',items:PSEL.tier+' load',quote:String(r.suggested),stage:'Quoted',created:today(),updated:today()});act('Quoted '+name+' $'+r.suggested);save();go('Pipeline');toast('Saved as a Quoted lead — follow up in 24h');}
function priceCalc(){
  const t=PTIERS.find(x=>x.k===PSEL.tier)||PTIERS[2],c=S.pricing;
  let hrs=t.hrs,tons=t.tons,sur=0,pct=0,wMult=1,flags=[];
  PITEMS.forEach(it=>{const q=PSEL.items[it.k]||0;if(q){sur+=it.price*q;tons+=(it.tons||0)*q;if(it.flag)flags.push(it.flag);}});
  PACCESS.forEach(a=>{if(PSEL.access.indexOf(a.k)>=0){pct+=a.pct||0;hrs+=a.hrs||0;if(a.weightMult)wMult*=a.weightMult;}});
  const dump=Math.max(c.dumpMin,tons*wMult*c.dumpTon),labor=hrs*c.hourly,floor=dump+c.fuel+labor;
  const suggested=Math.round((t.base*(c.priceAdj||1)+sur)*(1+pct)/5)*5;
  return {t,base:Math.round(t.base*(c.priceAdj||1)),sur,pct,hrs,dump,labor,fuel:c.fuel,floor,suggested,profit:suggested-floor,flags};
}
function pCopyQuote(){const r=priceCalc();copy("Got your photos, thanks! That's a firm $"+r.suggested+" — that covers all the labor, hauling, disposal, and sweep-up. No surprises, no hidden fees. I've got openings this week — want me to lock in a pickup window?","Quote copied — paste it to the customer");}
function vPricing(){
  const r=priceCalc(),c=S.pricing;
  const pc=r.suggested<r.floor?'due':r.profit>=150?'win':r.profit>=60?'warn':'due';
  const pmsg=r.suggested<r.floor?'⚠ BELOW COST — raise it':r.profit<60?'Thin margin':r.profit<150?'OK margin':'Healthy 💪';
  let h='<h2>Quote Calculator</h2><p class="muted" style="margin-bottom:10px">Eyeball the photo → tap how full the truck gets → add special items → fire back a firm price that\'s never below cost.</p>';
  h+='<div class="card" style="background:var(--e900);color:#fff;border:none">'
    +'<div class="row"><div class="grow"><div style="font-size:11px;letter-spacing:.1em;color:rgba(255,255,255,.55);text-transform:uppercase">Quote this</div><div style="font-size:40px;font-weight:900;color:var(--e200);line-height:1.05">$'+r.suggested+'</div></div>'
    +'<div style="text-align:right"><span class="pill '+pc+'">'+esc(pmsg)+'</span><div style="color:rgba(255,255,255,.7);margin-top:6px;font-size:12px">your cost ~$'+Math.round(r.floor)+'<br/>profit ~$'+Math.round(r.profit)+'</div></div></div>'
    +(r.flags.length?'<div style="color:#ffd27a;margin-top:8px;font-size:12.5px">⚑ '+esc(r.flags.join(' · '))+'</div>':'')
    +'<div class="row" style="margin-top:10px"><button class="b" onclick="pCopyQuote()">📋 Copy firm quote</button><button class="b ghost" onclick="pLogLead()">+ Log as lead</button><button class="b ghost" onclick="pReset()">Reset</button></div></div>';
  h+='<div class="card"><div class="row muted"><span class="grow">Base — '+r.t.k+' load</span><b>$'+r.base+'</b></div>'
    +(r.sur?'<div class="row muted"><span class="grow">Special items</span><b>+$'+r.sur+'</b></div>':'')
    +(r.pct?'<div class="row muted"><span class="grow">Access surcharge</span><b>+'+Math.round(r.pct*100)+'%</b></div>':'')
    +'<div class="row" style="border-top:1px solid var(--bl);margin-top:6px;padding-top:6px"><span class="grow muted">Cost floor — dump $'+Math.round(r.dump)+' + fuel $'+r.fuel+' + labor $'+Math.round(r.labor)+' ('+r.hrs+'h)</span><b>$'+Math.round(r.floor)+'</b></div></div>';
  h+='<h3>1 · How full does the truck get?</h3><div class="card"><div class="row" style="flex-wrap:wrap;gap:6px">'
    +PTIERS.map(t=>'<button class="b sm '+(PSEL.tier===t.k?'':'ghost')+'" onclick="pTier(\''+t.k+'\')" style="min-width:62px;line-height:1.2">'+t.label+(t.frac?'<br><span style="font-size:9px;opacity:.7">'+t.frac+'</span>':'')+'</button>').join('')+'</div></div>';
  h+='<h3>2 · Special items <span class="muted">(each adds its own dump fee)</span></h3><div class="card">'
    +PITEMS.map(it=>{const q=PSEL.items[it.k]||0;return '<div class="row" style="margin-bottom:7px"><span class="grow">'+esc(it.label)+(it.note?' <span class="muted">('+esc(it.note)+')</span>':'')+' <span class="muted">+$'+it.price+'</span></span><button class="b sm ghost" onclick="pItem(\''+it.k+'\',-1)">−</button><b style="min-width:22px;text-align:center">'+q+'</b><button class="b sm ghost" onclick="pItem(\''+it.k+'\',1)">+</button></div>';}).join('')+'</div>';
  h+='<h3>3 · Access &amp; load type</h3><div class="card"><div class="row" style="flex-wrap:wrap;gap:6px">'
    +PACCESS.map(a=>'<button class="b sm '+(PSEL.access.indexOf(a.k)>=0?'':'ghost')+'" onclick="pAcc(\''+a.k+'\')">'+esc(a.label)+'</button>').join('')+'</div></div>';
  h+='<details style="margin-top:10px"><summary>⚙️ Your cost settings — tune to your real numbers</summary><div class="card"><div class="g2">'
    +'<div><label>Dump $ / ton</label><input type="number" value="'+c.dumpTon+'" onchange="pCfg(\'dumpTon\',this.value)"></div>'
    +'<div><label>Dump minimum $</label><input type="number" value="'+c.dumpMin+'" onchange="pCfg(\'dumpMin\',this.value)"></div>'
    +'<div><label>Fuel + wear / job $</label><input type="number" value="'+c.fuel+'" onchange="pCfg(\'fuel\',this.value)"></div>'
    +'<div><label>Your target $ / hour</label><input type="number" value="'+c.hourly+'" onchange="pCfg(\'hourly\',this.value)"></div>'
    +'<div><label>Market price adjust (1 = as-is)</label><input type="number" step="0.05" value="'+(c.priceAdj||1)+'" onchange="pCfg(\'priceAdj\',this.value)"></div>'
    +'</div><p class="muted" style="margin-top:8px;font-size:11.5px">Defaults are Metro Detroit estimates. <b>Call your transfer station for their real per-ton rate</b> and set it here — that one number protects every quote. Saves on this device.</p></div></details>';
  h+='<div class="card muted" style="font-size:11.5px"><b>How to use it:</b> the suggested price is your smart starting point — in nicer areas you can go above it for convenience. The hard rule from that ad: <b>never quote below the cost floor.</b> The dump weight you can\'t see in a photo is what eats the profit, so when in doubt, size up.</div>';
  return h;
}
/* ============ ACTIONS ============ */
function copyMsg(id){const p=S.prospects.find(x=>x.id===id);const m=msgFor(p);copy((m.s?'Subject: '+m.s+'\n\n':'')+m.b,'Copied — paste into email/text. Then hit ✓ Advance.');}
function gm(id){
  const p=S.prospects.find(x=>x.id===id);
  const kind=CAD[p.status].tpl||'intro';
  const intro=msgFor(p,'intro');
  const m=kind==='intro'?intro:msgFor(p,kind);
  const subj=kind==='intro'?m.s:('Re: '+intro.s);
  if(!p.email){
    const e=prompt("Their email address (grab it from their website's contact page). Leave blank to type it in Gmail:");
    if(e===null)return;
    if(e.trim()){p.email=e.trim();save();}
  }
  window.open('https://mail.google.com/mail/?view=cm&fs=1&to='+encodeURIComponent(p.email||'')+'&su='+encodeURIComponent(subj)+'&body='+encodeURIComponent(m.b),'_blank');
  toast('Review it in Gmail and hit Send — then tap ✓ Advance here');
}
function advanceP(id){advance(S.prospects.find(x=>x.id===id));}
function statP(id,st){if(PSTATUSES.includes(st))setPStatus(S.prospects.find(x=>x.id===id),st);}
function copyScript(i){copy(SCRIPTS[i][1]);}
function setContact(id){const p=S.prospects.find(x=>x.id===id);const v=prompt('Decision maker name & title (e.g., Jane Smith — Operations Manager):',p.contact||'');if(v===null)return;p.contact=v.trim();save();render();toast(p.contact?'Saved — greet them by name in the email!':'Cleared');}
function setEmail(id){const p=S.prospects.find(x=>x.id===id);const v=prompt('Their email address:',p.email||'');if(v===null)return;p.email=v.trim();save();render();}
function domainOf(p){return (p.web||'').replace(/^https?:\/\//,'').replace(/^www\./,'').split('/')[0];}
function patterns(id){
  const p=S.prospects.find(x=>x.id===id);const d=domainOf(p);
  if(!d){toast('No website on file — tap 👤 Save contact and add their site first');return;}
  let names=(p.contact||'').replace(/[—–(].*$/,'').trim().toLowerCase().split(/\s+/).filter(w=>/^[a-z'.-]{2,}$/.test(w));
  let list=['info@'+d,'office@'+d];
  if(names.length>=2){const f=names[0],l=names[names.length-1];
    list=[f+'@'+d,f+'.'+l+'@'+d,(f[0]+l)+'@'+d,(f+l[0])+'@'+d,l+'@'+d].concat(list);}
  else if(names.length===1){list=[names[0]+'@'+d].concat(list);}
  list=[...new Set(list)];
  document.getElementById('pat-'+p.id).innerHTML='<div style="margin-top:6px">'+list.map(e=>'<span class="srch" style="cursor:pointer" onclick="copy(\''+e+'\')">'+e+' 📋</span><a class="srch" target="_blank" href="https://www.google.com/search?q='+encodeURIComponent('"'+e+'"')+'">verify</a>').join('')+'</div><div class="muted" style="margin-top:4px;font-size:11.5px">Tap an address to copy · "verify" googles it in quotes (a hit = it\'s real). With small companies, info@ usually lands on the owner\'s phone anyway.</div>';
}
function aiResearch(id){
  const p=S.prospects.find(x=>x.id===id);
  copy('You are my B2B prospect researcher (like ZoomInfo, but you cite sources). Company: '+p.name+' — '+p.cat+' in '+p.city+', Michigan'+(p.web?' — website: '+p.web:'')+'.\n\nUsing web search, find:\n1) The decision maker who would hire a junk removal / cleanout vendor (owner, operations manager, property manager, or project manager). Full name + title.\n2) The best email to reach them. Check: the company website (contact/about/team pages), LinkedIn, their Facebook page, and the Michigan LARA business entity search at cofs.lara.state.mi.us (the registered agent of the LLC is often the owner).\n3) A direct phone number if listed.\n\nRules: NEVER invent an email address. If you infer one from a pattern, label it GUESS. Answer in exactly this format:\nName | Title | Email (or GUESS: address) | Phone | Source URLs','AI researcher copied — paste into Claude or ChatGPT (web search on), then save what it finds with 👤 and ✉');
}
function bump(id){const l=S.leads.find(x=>x.id===id);l.stage='Contacted';l.updated=today();act('Replied to lead: '+l.name);save();render();}
function moveLead(id,dir){const l=S.leads.find(x=>x.id===id);const i=LSTAGES.indexOf(l.stage)+dir;if(i>=0&&i<LSTAGES.length){l.stage=LSTAGES[i];l.updated=today();act(l.name+' → '+l.stage);save();render();}}
function delLead(id){if(confirm('Delete this lead?')){S.leads=S.leads.filter(x=>x.id!==id);save();render();}}
function editQuote(id){const l=S.leads.find(x=>x.id===id);const q=prompt('Quote amount ($):',l.quote||'');if(q!==null){l.quote=q;save();render();}}
function addLeadUI(){
  const name=prompt('Customer name:');if(!name)return;
  const phone=prompt('Phone:')||'';
  const city=prompt('City:')||'';
  const source=prompt('Source (Google / Facebook / Thumbtack / Referral / Sign / Other):')||'Other';
  const items=prompt('What needs to go?')||'';
  S.leads.unshift({id:'l'+Date.now(),name,phone,city,source,items,quote:'',stage:'New Lead',created:today(),updated:today()});
  act('New lead: '+name+' ('+source+')');save();render();toast('Lead added — reply within 5 minutes!');
}
function addProspectUI(){
  const name=prompt('Company name:');if(!name)return;
  const cat=prompt('Category (PM / Estate / Realtor / Senior / Mover / Contractor / Dumpster / Storage):','PM')||'PM';
  const city=prompt('City:')||'';
  const web=prompt('Website (optional):')||'';
  const notes=prompt('Why they need a hauler (one line):')||'';
  S.prospects.unshift({id:'p'+Date.now(),cat,name,city,web,phone:'',notes,ek:'',email:'',status:'New',last:'',due:today(),log:[]});
  act('New prospect: '+name);save();render();toast('Added — intro email is ready on the Today tab');
}
function exportJSON(){const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cleanplate-crm-backup-'+today()+'.json';a.click();}
function exportCSV(){const rows=[['Name','Phone','City','Source','Items','Quote','Stage','Created']].concat(S.leads.map(l=>[l.name,l.phone,l.city,l.source,l.items,l.quote,l.stage,l.created]));const csv=rows.map(r=>r.map(c=>'"'+String(c||'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='cleanplate-leads-'+today()+'.csv';a.click();}
function importJSON(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.prospects&&d.leads){S=migrate(d);save();render();toast('Restored!');}else toast('Not a valid backup file');}catch(e){toast('Could not read that file');}};r.readAsText(f);}

/* ---- access gate: SHA-256 of the passphrase (privacy lock for an internal tool, not high-grade security) ---- */
const GATE_HASH='5d03c6cc82999234d06cd2f95a898b5725e0dd5d9ed4b288e6755440edf28683';
const GATE_KEY='cph_unlock_v1';
async function sha256hex(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}
function showApp(){const g=document.getElementById('gate');if(g)g.style.display='none';render();}
async function tryUnlock(){const i=document.getElementById('gpw'),e=document.getElementById('gerr');try{const h=await sha256hex(i.value);if(h===GATE_HASH){localStorage.setItem(GATE_KEY,'1');showApp();}else{e.textContent='Incorrect password — try again.';e.style.display='block';i.value='';i.focus();}}catch(_){e.textContent='Open this page over https to unlock.';e.style.display='block';}}
function lock(){localStorage.removeItem(GATE_KEY);location.reload();}
function boot(){if(localStorage.getItem(GATE_KEY)==='1'){showApp();return;}const g=document.getElementById('gate');if(g)g.style.display='flex';const i=document.getElementById('gpw');if(i){i.focus();i.addEventListener('keydown',ev=>{if(ev.key==='Enter')tryUnlock();});}}
boot();
</script>
